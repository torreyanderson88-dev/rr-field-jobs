<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b2a45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RR Jobs">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>RR Jobs</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<style>
  /* Phone-first job finder: navy header with logo + search, folder tabs, one card per job with a big Egnyte button. */
  :root{
    --bg:#f3f5f7; --card:#ffffff; --ink:#18212b; --muted:#5f6b78; --line:#dde3e9;
    --head:#0b2a45; --head-ink:#ffffff; --head-muted:#b9c9d8; --brand:#ffde00;
    --accent:#004a80; --accent-ink:#ffffff; --accent-soft:#e2edf6; --input:#ffffff; --input-ink:#18212b;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#11161c; --card:#1b232c; --ink:#e6ebf0; --muted:#9aa7b4; --line:#2c3743;
    --head:#061a2c; --head-ink:#ffffff; --head-muted:#9fb3c6; --brand:#ffde00;
    --accent:#2f80c4; --accent-ink:#ffffff; --accent-soft:#16324d; --input:#243039; --input-ink:#e6ebf0; color-scheme:dark } }
  :root[data-theme="dark"]{
    --bg:#11161c; --card:#1b232c; --ink:#e6ebf0; --muted:#9aa7b4; --line:#2c3743;
    --head:#061a2c; --head-ink:#ffffff; --head-muted:#9fb3c6; --brand:#ffde00;
    --accent:#2f80c4; --accent-ink:#ffffff; --accent-soft:#16324d; --input:#243039; --input-ink:#e6ebf0; color-scheme:dark }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{padding-top:env(safe-area-inset-top,0px)}
  body{background:var(--bg);color:var(--ink);font:16px/1.4 "Segoe UI",system-ui,-apple-system,Arial,sans-serif}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
  .gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  header{background:var(--head);color:var(--head-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
  header .gut{padding-block:12px;display:grid;gap:10px;max-width:760px;margin:0 auto}
  .top{display:flex;align-items:center;gap:12px;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand img{height:36px;width:auto;display:block}
  .brand span{color:var(--brand);font-weight:600;font-size:17px;white-space:nowrap}
  .stamp{font-size:12px;color:var(--head-muted);text-align:right}
  #q{width:100%;padding:12px 14px;border-radius:10px;border:0;font:inherit;font-size:17px;background:var(--input);color:var(--input-ink);outline:none}
  #q:focus{box-shadow:0 0 0 3px rgba(255,222,0,.55)}
  .tabs{display:flex;gap:8px;flex-wrap:wrap}
  .tab{flex:1 1 auto;white-space:nowrap;border:1px solid var(--head-muted);background:transparent;color:var(--head-ink);padding:8px 10px;border-radius:8px;font:inherit;font-size:15px;cursor:pointer}
  .tab small{opacity:.75;margin-left:4px}
  .tab.on{background:var(--brand);border-color:var(--brand);color:#0b2a45;font-weight:600}
  .tab:focus-visible,a.go:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
  main{padding-block:12px 32px;max-width:760px;margin:0 auto}
  .pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .pill{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
  .pill.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}
  .pill:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .where{display:inline-block;font-size:12px;font-weight:600;color:var(--accent);margin-bottom:2px}
  .count{font-size:13px;color:var(--muted);margin:2px 2px 10px}
  .list{display:grid;gap:10px}
  .job{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px}
  .info{flex:1;min-width:0}
  .info b{display:block;font-size:16px;line-height:1.3;overflow-wrap:anywhere}
  .info span{display:block;font-size:14px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
  a.go{flex:none;display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:10px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:600;font-size:15px}
  .empty,.note{padding:28px 12px;text-align:center;color:var(--muted)}
  .more{text-align:center;margin-top:12px}
  .more button{font:inherit;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
  @media (max-width:380px){ .brand span{display:none} }
</style>
</head>
<body>
<header><div class="gut">
  <div class="top">
    <div class="brand"><img src="logo.png" alt="Ridge Rock Inc." width="125" height="36"><span>Field Jobs</span></div>
    <div class="stamp" id="stamp">Loading...</div>
  </div>
  <input id="q" type="search" placeholder="Search job name, job #, or customer" autocomplete="off" aria-label="Search jobs">
  <div class="tabs" id="tabs"></div>
</div></header>
<main class="gut">
  <div class="pills" id="pills"></div>
  <div class="count" id="count"></div>
  <div class="list" id="list"></div>
  <div class="more" id="more"></div>
</main>
<script>
(function(){
  var EGNYTE='https://egnyte.paveamerica.com/app/index.do#storage/files/1';
  var ROOT=['Shared','RidgeRock','Operations','PROJECTS'];
  var D=null, byId={}, state={ view:'jobs', q:'', limit:60 };
  var $=function(id){ return document.getElementById(id); };
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function folderUrl(r){ var v=D.views[r[0]]; var parts=ROOT.concat(v.path.split('\\'), [r[1]]); return EGNYTE+'/'+parts.map(encodeURIComponent).join('/'); }
  function label(i){ var v=D.views[i]; return v.group ? v.group+' - '+v.label : v.label; }
  function fmtStamp(g){ var m=/^(\d{4})-(\d\d)-(\d\d) (\d\d):(\d\d)/.exec(g||''); if(!m) return esc(g); var h=+m[4], ap=h>=12?'PM':'AM'; h=h%12||12; return (+m[2])+'/'+(+m[3])+' '+h+':'+m[5]+' '+ap; }
  function build(){
    if(!D) return;
    var counts={}; D.rows.forEach(function(r){ counts[r[0]]=(counts[r[0]]||0)+1; });
    var tabs=[], seen={};
    D.views.forEach(function(v,i){
      if(v.group){ if(!seen[v.group]){ seen[v.group]={id:'g:'+v.group,label:v.group,n:0}; tabs.push(seen[v.group]); } seen[v.group].n+=(counts[i]||0); }
      else tabs.push({id:v.id,label:v.label,n:counts[i]||0});
    });
    if(!byId.hasOwnProperty(state.view)) state.view=D.views[0].id;
    var ci=byId[state.view], cur=D.views[ci], curTab=cur.group?'g:'+cur.group:cur.id;
    $('tabs').innerHTML=tabs.map(function(t){ return '<button class="tab'+(!state.q&&t.id===curTab?' on':'')+'" data-tab="'+esc(t.id)+'">'+esc(t.label)+'<small>'+t.n.toLocaleString()+'</small></button>'; }).join('');
    $('pills').innerHTML=(!state.q&&cur.group)? D.views.map(function(v,i){ return v.group===cur.group ? '<button class="pill'+(v.id===state.view?' on':'')+'" data-view="'+esc(v.id)+'">'+esc(v.label)+' ('+(counts[i]||0)+')</button>' : ''; }).join('') : '';
    var rows;
    if(state.q){ var w=state.q.toLowerCase().split(/\s+/).filter(Boolean);
      rows=D.rows.filter(function(r){ var h=(r[1]+' '+r[2]+' '+r[3]).toLowerCase(); return w.every(function(x){ return h.indexOf(x)>=0; }); }); }
    else rows=D.rows.filter(function(r){ return r[0]===ci; });
    $('count').textContent = state.q ? (rows.length.toLocaleString()+' match'+(rows.length===1?'':'es')+' in all folders') : (rows.length.toLocaleString()+' folders');
    var shown=rows.slice(0,state.limit);
    $('list').innerHTML = shown.length ? shown.map(function(r){
      var sub=[r[2],r[3]].filter(Boolean).map(esc).join(' &middot; ');
      return '<div class="job"><div class="info">'+(state.q?'<span class="where">'+esc(label(r[0]))+'</span>':'')+'<b>'+esc(r[1])+'</b>'+(sub?'<span>'+sub+'</span>':'')+'</div>'
        +'<a class="go" href="'+esc(folderUrl(r))+'" target="_blank" rel="noopener">Open folder</a></div>';
    }).join('') : '<div class="empty">'+(state.q?'No jobs match that search.':'Nothing in this folder right now.')+'</div>';
    $('more').innerHTML = rows.length>shown.length ? '<button id="showall">Show all '+rows.length.toLocaleString()+'</button>' : '';
  }
  document.addEventListener('click',function(e){
    var t=e.target.closest('[data-tab],[data-view],#showall'); if(!t) return;
    if(t.dataset.tab){ var id=t.dataset.tab;
      if(id.indexOf('g:')===0){ var g=id.slice(2); for(var i=0;i<D.views.length;i++){ if(D.views[i].group===g){ state.view=D.views[i].id; break; } } } else state.view=id;
      state.q=''; $('q').value=''; state.limit=60; build(); window.scrollTo(0,0); }
    else if(t.dataset.view){ state.view=t.dataset.view; state.limit=60; build(); window.scrollTo(0,0); }
    else { state.limit=1e9; build(); }
  });
  $('q').addEventListener('input',function(){ state.q=this.value.trim(); state.limit=60; build(); });
  function load(){
    return fetch('jobs.json?t='+Date.now(),{cache:'no-store'}).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d){ D=d; byId={}; d.views.forEach(function(v,i){ byId[v.id]=i; }); $('stamp').innerHTML='Updated<br>'+fmtStamp(d.generated); build(); });
  }
  load().catch(function(){ $('stamp').textContent=''; $('list').innerHTML='<div class="empty">The job list did not load. Check your signal and pull down to refresh.</div>'; });
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible' && D) load().catch(function(){}); });
})();
</script>
</body>
</html>
